if(b)return b}}return null}

const LOGO=s=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 48 48" aria-label="Lift logo"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff3d2e"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lgg)"/><path d="M7 24h34" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="10" y="18" width="4.5" height="12" rx="2.2" fill="#fff"/><rect x="16.5" y="13.5" width="4.5" height="21" rx="2.2" fill="#fff"/><rect x="27" y="13.5" width="4.5" height="21" rx="2.2" fill="#fff"/><rect x="33.5" y="9" width="4.5" height="30" rx="2.2" fill="#fff"/></svg>';
function head(t){return'<div class="top"><div class="brand">'+LOGO(32)+'<b>Lift</b></div><button class="ib" data-a="settings" aria-label="Settings">'+IC.gear+'</button></div>'+(t?'<h1 class="pt">'+t+'</h1>':'')}
const dd=(a,b)=>{const x=pd(a),y=pd(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)};
function slotFor(rt,date){if(!rt)return null;const n=rt.days.length;
if(rt.mode==='cycle'&&n){const k=((dd(rt.start||date,date)%n)+n)%n;return{ids:(rt.days[k]||[]).filter(gget),label:'Day '+(k+1)+' of '+n,k}}
const k=wdi(date);return{ids:(rt.days[k]||[]).filter(gget),label:DAYS[k],k}}
const rtDesc=rt=>rt.mode==='cycle'?(rt.days.filter(x=>x.length).length+' training + '+rt.days.filter(x=>!x.length).length+' rest, repeating'):'Weekly plan, Monday to Sunday';
function rebuildC(d){const old=d.daysC,a=[];for(let i=0;i<d.tr;i++)a.push(old[i]||[]);for(let i=0;i<d.rs;i++)a.push([]);d.daysC=a;if(d.cur>a.length)d.cur=1}
const DOCS={
about:{t:'About Lift',h:()=>'<div class="lg">'+LOGO(84)+'<b>Lift</b><div class="mu">Version '+APPV+'</div></div><p style="margin-top:18px">Lift is a minimal workout tracker. Build exercise groups, plan a weekly or rotating split, log every set and watch your personal records and progress grow.</p><p>It runs entirely in your browser. There is no account, no sign-in and no server that receives your workouts.</p><h3>What you can do</h3><ul><li>Create your own workout groups like Back, Legs or Chest + Triceps</li><li>Plan weekly routines or rotating splits such as 4 training days and 1 rest day</li><li>Log sets, reps and weight with warm-ups, and see your last session and PR</li><li>Track progress with charts per exercise, weekly volume and muscle balance</li></ul>'},
help:{t:'Help & FAQ',h:()=>'<details><summary>How do I build a workout?</summary><p>Open Workouts, tap New workout group, pick exercises and set warm-up sets, working sets and reps. Mix any muscles you like.</p></details><details><summary>How do I set up a 4-day split with a rest day?</summary><p>Open Routine, tap New routine, choose Rotating, then set 4 training days and 1 rest day. Tap each day to choose its groups, and tell Lift which day of the cycle today is.</p></details><details><summary>How do routines pick today’s workout?</summary><p>Weekly routines follow Monday to Sunday. Rotating routines advance one day at a time by calendar date, so a rest day stays a rest day.</p></details><details><summary>How are PRs counted?</summary><p>A PR is a completed, non-warm-up set with more weight than any earlier set of that exercise. Your first ever set is the baseline and isn’t counted. Sets only count once you tick them done.</p></details><details><summary>Can I log a past day?</summary><p>Yes. On Today, use the arrows to move to another date, or tap a day in History.</p></details><details><summary>Does it work offline?</summary><p>Yes. Everything, including the exercise illustrations, is inside the page. After it has loaded, no internet connection is needed.</p></details><details><summary>How do I back up or move my data?</summary><p>In Settings, tap Show backup, copy the text and keep it somewhere safe. To restore, paste it into the same box and tap Restore from text.</p></details>'},
privacy:{t:'Privacy Policy',h:()=>'<p class="mu">Last updated: November 2026</p><h3>Summary</h3><p>Lift does not collect, sell or share your personal information. Your workout data stays on your device.</p><h3>What Lift stores</h3><p>Your workout groups, routines, training logs, custom exercises and settings are saved in your browser’s local storage on this device. Lift has no account system and no server that receives this data.</p><h3>What Lift does not do</h3><ul><li>No analytics, advertising or tracking scripts</li><li>No third-party services or network requests for your data</li><li>No access to your camera, microphone, contacts or location</li></ul><h3>Hosting</h3><p>The page itself is delivered by its host, which may keep standard web server logs under its own policies. Those logs do not include your workout data, because that never leaves your device.</p><h3>Backups and sharing</h3><p>Data leaves your device only if you copy a backup yourself and paste it somewhere.</p><h3>Deleting your data</h3><p>Use Erase all data in Settings, or clear this site’s data in your browser. Because nothing is stored elsewhere, that removes everything.</p><h3>Health information</h3><p>Weights, reps and body-training notes you log are your own information. Keep your backups private if you consider them sensitive.</p><h3>Changes</h3><p>If this policy changes, the updated version will appear here with a new date.</p>'},
terms:{t:'Terms of Use',h:()=>'<p class="mu">Last updated: November 2026</p><h3>Use at your own risk</h3><p>Lift is a logging tool, not medical or coaching advice. Exercise carries a risk of injury. Check with a doctor before starting a new training program, and stop if something hurts.</p><h3>No warranty</h3><p>Lift is provided as is, without guarantees of accuracy or availability. Your data lives in your browser and can be lost if you clear site data or switch devices, so back it up from Settings.</p><h3>Your content</h3><p>Your logs and custom exercises belong to you.</p><h3>Acceptable use</h3><p>Use Lift for personal training tracking. Don’t try to disrupt or misuse the page.</p>'},
credits:{t:'Credits',h:()=>'<h3>Exercise list</h3><p>Exercise names, muscle groups and equipment are based on the Free Exercise DB by yuhonas, released into the public domain under the Unlicense. Thank you to everyone who contributed to it.</p><h3>Design</h3><p>The exercise illustrations, icons, logo and interface were drawn for Lift. Lift uses your device’s system fonts.</p>'}
};
function gNames(ids){return ids.map(id=>{const g=gget(id);return g?esc(g.name):''}).filter(Boolean).join(' + ')}

function vToday(){const d=ui.date,L=S.logs[d],isT=d===today();
let h='<div class="dn"><button class="ib sq" data-a="dprev" aria-label="Previous day">'+IC.cl+'</button><div class="dt"><b>'+(isT?'Today':esc(pd(d).toLocaleDateString(undefined,{weekday:'long'})))+'</b><span>'+esc(fmtLong(d))+'</span></div><button class="ib sq" data-a="dnext" aria-label="Next day">'+IC.cr+'</button></div>';
if(!isT)h+='<div style="text-align:center;margin:-6px 0 14px"><button class="btn sm" data-a="dtoday">Jump to today</button></div>';
if(!L)return h+vChoose(d);
if(L.rest)return h+'<div class="card empty"><h3>Rest day</h3><div>Recovery counts too.</div><div style="margin-top:16px"><button class="btn" data-a="resetDay">Change</button></div></div>';
const all=L.entries.reduce((a,e)=>a.concat(e.sets),[]),tot=all.length,dn=all.filter(s=>s.d).length,C=2*Math.PI*26,pct=tot?dn/tot:0,v=vol(L),pc=(prByDay()[d]||new Set()).size;
h+='<div class="card sumc"><div class="grow"><div class="mu sm-t">'+(L.groups.length?'Workout':'Custom workout')+'</div><div class="sumt">'+(L.groups.length?gNames(L.groups):'Your session')+'</div><div class="chips" style="margin-top:10px"><span class="chip st">'+L.entries.length+' exercise'+(L.entries.length===1?'':'s')+'</span>'+(v?'<span class="chip st">'+fmtN(v)+' '+S.unit+'</span>':'')+(pc?'<span class="chip st pr">★ '+pc+' PR'+(pc>1?'s':'')+'</span>':'')+'</div></div>'
+'<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="'+dn+' of '+tot+' sets done"><circle class="rt" cx="32" cy="32" r="26"/><circle class="rf" cx="32" cy="32" r="26" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 32 32)"/><text class="rx" x="32" y="37" text-anchor="middle">'+dn+'/'+tot+'</text></svg></div>';
L.entries.forEach((en,i)=>h+=entryHTML(en,i,d));
h+='<div style="display:flex;gap:10px"><button class="btn line grow" data-a="logAddEx">+ Exercise</button><button class="btn line grow" data-a="logAddGrp">+ Group</button></div><button class="lnk" data-a="resetDay">Change workout</button>';
return h}

function vChoose(d){let h='';const rt=S.routines.find(r=>r.id===S.active),sl=slotFor(rt,d);
if(rt&&sl.ids.length){const gs=sl.ids.map(gget),exs=[];gs.forEach(g=>g.items.forEach(i=>{if(!exs.includes(i.ex))exs.push(i.ex)}));
const sets=gs.reduce((a,g)=>a+g.items.reduce((b,i)=>b+i.sets+i.wu,0),0);
h+='<div class="hero"><div class="hl1">'+esc(rt.name)+' · '+esc(sl.label)+'</div><div class="hl2">'+gNames(sl.ids)+'</div><div class="hph">'+exs.map(getEx).filter(Boolean).slice(0,4).map(x=>exThumb(x,'hp')).join('')+'</div><div class="hl3">'+exs.length+' exercises · '+sets+' sets</div><button class="btn pri blk" data-a="startR">Start workout</button></div>'}
else if(rt){h+='<div class="hero"><div class="hl1">'+esc(rt.name)+' · '+esc(sl.label)+'</div><div class="hl2">Rest day</div><div class="hl3">Recovery is where the progress happens.</div><button class="btn blk ghw" data-a="rest">Log rest day</button></div>'}
h+='<div class="card"><h3 style="font-size:18px">'+(rt?'Train something else':'What did you train?')+'</h3>';
if(!S.groups.length)h+='<p class="sub" style="margin:6px 0 14px">Create workout groups in the Workouts tab, or start with an empty workout and add exercises as you go.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn" data-a="seed">Add example workouts</button></div>';
else h+='<p class="sub" style="margin:4px 0 12px">Pick one or more groups and mix as you like.</p><div class="chips" style="margin-bottom:16px">'+S.groups.map(g=>'<button class="chip '+(ui.pick.has(g.id)?'on':'')+'" data-a="pickg" data-id="'+g.id+'">'+esc(g.name)+'</button>').join('')+'</div>';
h+='<div style="display:flex;gap:8px;flex-wrap:wrap">'+(S.groups.length?'<button class="btn pri" data-a="startPick" '+(ui.pick.size?'':'disabled')+'>Start'+(ui.pick.size?' ('+ui.pick.size+')':'')+'</button>':'')+'<button class="btn" data-a="empty">Empty workout</button>'+(rt?'':'<button class="btn" data-a="rest">Rest day</button>')+'</div></div>';
return h}

function entryHTML(en,ei,date){
const ex=getEx(en.ex)||{name:'Removed exercise',m:'Chest',e:'W'},st=stats(en.ex),lp=lastPerf(en.ex,date);
let n=0,anyPR=false;
const rows=en.sets.map((s,si)=>{if(!s.wu)n++;const isp=st.flags.has(s);if(isp)anyPR=true;
return'<div class="sr '+(s.d?'on':'')+(s.wu?' wu':'')+(isp?' isp':'')+'"><span class="sb">'+(isp?'★':s.wu?'W':n)+'</span>'
+'<label class="fld"><input type="number" inputmode="decimal" step="any" data-f="w" data-e="'+ei+'" data-s="'+si+'" value="'+esc(s.w)+'" placeholder="'+(lp?lp.w:'0')+'" aria-label="Weight in '+S.unit+'"><span>'+S.unit+'</span></label>'
+'<i class="xx">×</i>'
+'<label class="fld"><input type="number" inputmode="numeric" data-f="r" data-e="'+ei+'" data-s="'+si+'" value="'+esc(s.r)+'" placeholder="'+(lp&&lp.r?lp.r:'0')+'" aria-label="Reps"><span>reps</span></label>'
+'<button class="ck" data-a="done" data-e="'+ei+'" data-s="'+si+'" aria-label="Mark set done">'+IC.check+'</button></div>'}).join('');
return'<div class="card"><div class="ex-h">'+exThumb(ex)+'<div class="grow"><div class="nm" style="font-size:17px">'+esc(ex.name)+'</div><div class="mu sm-t" style="margin-top:2px">'+ex.m+' · '+EQ[ex.e]+'</div>'
+'<div class="chips" style="margin-top:8px;gap:6px">'+(st.pr?'<span class="chip st pr">PR '+fmtN(st.pr.w)+' '+S.unit+' × '+fmtN(st.pr.r)+'</span>':'<span class="chip st">No PR yet</span>')+(lp?'<span class="chip st">Last '+fmtN(lp.w)+' × '+esc(lp.r||'–')+'</span>':'')+(anyPR?'<span class="chip st pr">New PR!</span>':'')+'</div></div>'
+'<button class="ib" data-a="delentry" data-e="'+ei+'" aria-label="Remove exercise" style="margin:-8px -10px 0 0;font-size:22px;color:var(--mu)">×</button></div>'
+rows+'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" data-a="addset" data-e="'+ei+'">+ Set</button><button class="btn sm" data-a="addwu" data-e="'+ei+'">+ Warm-up</button><button class="btn sm" data-a="rmset" data-e="'+ei+'" style="margin-left:auto">− Set</button></div></div>'}

function vWork(){let h=head('Workouts');
h+='<p class="sub">Reusable exercise lists like Back, Legs or Biceps. Combine them into routines.</p>';
if(!S.groups.length)h+='<div class="card empty"><h3>No workout groups yet</h3><div>Build one per muscle group, then combine them in a routine.</div><div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-a="newg">Create group</button><button class="btn" data-a="seed">Add examples</button></div></div>';
else{S.groups.forEach(g=>{const ex=g.items.map(i=>getEx(i.ex)).filter(Boolean),ms=[...new Set(ex.map(x=>x.m))].slice(0,3).join(', ');
h+='<button class="hrow" data-a="editg" data-id="'+g.id+'"><div class="stack">'+ex.slice(0,3).map(x=>exThumb(x,'av')).join('')+'</div><div class="grow"><div class="nm" style="font-size:17px">'+esc(g.name)+'</div><div class="mu sm-t">'+g.items.length+' exercise'+(g.items.length===1?'':'s')+(ms?' · '+ms:'')+'</div></div><span class="mu">'+IC.cr.replace('<svg','<svg width="18" height="18"')+'</span></button>'});
h+='<button class="btn line blk" data-a="newg" style="margin-top:4px;padding:15px">+ New workout group</button>'}
return h}

function vRout(){let h=head('Routines');
h+='<p class="sub">Plan a weekly schedule, or run a rotating split like 4 training days and 1 rest day.</p>';
if(!S.groups.length)return h+'<div class="card empty"><h3>Create workout groups first</h3><div>Routines are built from them.</div><div style="margin-top:16px"><button class="btn pri" data-a="tab" data-v="work">Go to Workouts</button></div></div>';
S.routines.forEach(r=>{const act=r.id===S.active,tk=slotFor(r,today()).k;
h+='<div class="card"><div class="row" style="margin-bottom:8px"><div class="grow"><div class="nm" style="font-size:18px">'+esc(r.name)+(act?'<span class="badge">Active</span>':'')+'</div><div class="mu sm-t">'+rtDesc(r)+'</div></div><button class="btn sm" data-a="editr" data-id="'+r.id+'">Edit</button>'+(act?'':'<button class="btn sm pri" data-a="setActive" data-id="'+r.id+'">Use</button>')+'</div>'
+r.days.map((ids,i)=>{const t=ids.filter(gget);return'<div class="day '+(i===tk?'now':'')+'"><span class="d">'+(r.mode==='cycle'?'Day '+(i+1):DAYS[i].slice(0,3))+'</span><span class="grow '+(t.length?'':'mu')+'">'+(t.length?gNames(t):'Rest')+'</span>'+(i===tk?'<span class="badge">Today</span>':'')+'</div>'}).join('')+'</div>'});
h+='<button class="btn line blk" data-a="newr" style="padding:15px">+ New routine</button>';
return h}

function vHist(){let h=head('History');
const days=Object.keys(S.logs).sort().reverse();
if(!days.length)return h+'<div class="card empty"><h3>Nothing logged yet</h3><div>Your training days will show up here.</div></div>';
const prm=prByDay();const groups=[];
days.forEach(d=>{const mk=pd(d).toLocaleDateString(undefined,{month:'long',year:'numeric'});let g=groups[groups.length-1];if(!g||g.mk!==mk){g={mk,rows:[]};groups.push(g)}g.rows.push(d)});
groups.forEach(g=>{h+='<div class="hmon">'+esc(g.mk)+'</div><div class="tb2">'+g.rows.map(d=>{const L=S.logs[d],dt=pd(d),prs=prm[d]||new Set();
const nm=(L.entries||[]).map(e=>{const x=getEx(e.ex);return x?(prs.has(e.ex)?'<b>★ '+esc(x.name)+'</b>':esc(x.name)):''}).filter(Boolean).join(', ');
return'<button class="hr" data-a="openDay" data-d="'+d+'"><div class="hd"><span>'+esc(dt.toLocaleDateString(undefined,{weekday:'short'}))+'</span><b>'+dt.getDate()+'</b></div><div class="hb">'
+(L.rest?'<div class="g mu">Rest day</div>':'<div class="g">'+(L.groups.length?gNames(L.groups):'Custom workout')+'</div>'+(nm?'<div class="x">'+nm+'</div>':''))+'</div>'
+(prs.size?'<span class="star" aria-label="Personal record">★'+(prs.size>1?'<i>'+prs.size+'</i>':'')+'</span>':'')+'</button>'}).join('')+'</div>'});
return h}

function pgRows(){const q=toks(ui.pq||''),ids=new Set();Object.values(S.logs).forEach(L=>(L.entries||[]).forEach(e=>ids.add(e.ex)));
const rows=[...ids].map(id=>({ex:getEx(id),ss:sessions(id)})).filter(r=>r.ex&&r.ss.length&&q.every(t=>hay(r.ex).some(w=>w.startsWith(t))));
rows.sort((a,b)=>b.ss[b.ss.length-1].d.localeCompare(a.ss[a.ss.length-1].d));
if(!rows.length)return'<div class="card empty"><h3>'+(ui.pq?'No match':'No lifts tracked yet')+'</h3><div>'+(ui.pq?'Try another name.':'Mark sets as done on the Today tab and your progress shows up here.')+'</div></div>';
return rows.map(r=>{const st=stats(r.ex.id),last=r.ss[r.ss.length-1];
return'<button class="hrow" data-a="openProg" data-id="'+r.ex.id+'">'+exThumb(r.ex)+'<div class="grow"><div class="nm">'+esc(r.ex.name)+'</div><div class="mu sm-t">'+r.ss.length+' session'+(r.ss.length>1?'s':'')+' · last '+fmtN(last.tp.w)+' × '+fmtN(last.tp.r)+'</div></div>'+spark(r.ss)+(st.pr?'<span class="chip st pr">'+fmtN(st.pr.w)+'</span>':'')+'</button>'}).join('')}
function pgList(){const e=$('#pg-list');if(e)e.innerHTML=pgRows()}

function volWeeks(n){const now=today(),mon=addD(now,-wdi(now)),out=[];for(let i=n-1;i>=0;i--){const s=addD(mon,-7*i);let v=0;for(let k=0;k<7;k++){const L=S.logs[addD(s,k)];if(L)v+=vol(L)}out.push({d:s,y:Math.round(v),pr:false})}return out}
function muscleSets(days){const c={},from=addD(today(),-days+1);for(const d in S.logs){if(d<from)continue;for(const en of S.logs[d].entries||[]){const x=getEx(en.ex);if(!x)continue;const n=en.sets.filter(s=>s.d&&!s.wu).length;if(n)c[x.m]=(c[x.m]||0)+n}}return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function topLifts(){const ids={};Object.values(S.logs).forEach(L=>(L.entries||[]).forEach(e=>{ids[e.ex]=1}));return Object.keys(ids).map(id=>({id,ex:getEx(id),ss:sessions(id)})).filter(r=>r.ex&&r.ss.length).sort((a,b)=>b.ss.length-a.ss.length)}
const fmtK=v=>v>=10000?fmtN(Math.round(v/100)/10)+'k':String(Math.round(v));
const metricPts=(ss,m)=>ss.map(x=>({d:x.d,pr:x.pr,y:m==='w'?x.tp.w:m==='e'?Math.round(x.e1*10)/10:Math.round(x.v)}));
function vProg(){let h=head('Progress');const tl=topLifts();
if(!tl.length)return h+'<div class="card empty"><h3>No progress to show yet</h3><div>Log a workout and tick your sets as done. Charts for weekly volume, muscle balance and every lift will appear here.</div></div>';
const now=today(),from=addD(now,-29),prm=prByDay();let wk=0,v=0,pc=0,sets=0;
Object.keys(S.logs).forEach(d=>{if(d<from||d>now)return;const L=S.logs[d];if(!L.rest&&L.entries.length){wk++;v+=vol(L);L.entries.forEach(e=>e.sets.forEach(s=>{if(s.d&&!s.wu)sets++}))}pc+=prm[d]?prm[d].size:0});
h+='<div class="tiles t2"><div class="tile"><b>'+wk+'</b><span>Workouts, last 30 days</span></div><div class="tile"><b>'+sets+'</b><span>Working sets</span></div><div class="tile"><b>'+fmtK(v)+' <small style="font-size:14px;font-weight:650;color:var(--mu)">'+S.unit+'</small></b><span>Volume lifted</span></div><div class="tile"><b>'+pc+(pc?' ★':'')+'</b><span>New PRs</span></div></div>';
const sel=tl.find(r=>r.id===ui.pex)||tl[0];
h+='<div class="card"><div class="ct2">Lift progress</div><div class="sub2">Pick a lift to see how it’s trending</div><div class="pk-chips" style="padding:0 0 10px;margin:0 -2px">'+tl.slice(0,8).map(r=>'<button class="chip '+(r.id===sel.id?'on':'')+'" data-a="pex" data-id="'+r.id+'">'+esc(r.ex.name)+'</button>').join('')+'</div>'
+'<div class="seg">'+[['w','Top weight'],['e','Est. 1RM'],['v','Volume']].map(m=>'<button class="'+(ui.pm===m[0]?'on':'')+'" data-a="pmi" data-v="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>'
+lineChart(metricPts(sel.ss,ui.pm),ui.pm==='v'?fmtK:x=>fmtN(Math.round(x*10)/10))
+'<div class="mu sm-t" style="margin:6px 0 12px">★ marks a session with a new PR</div><button class="btn sm" data-a="openProg" data-id="'+sel.id+'">Open details</button></div>';
h+='<div class="card"><div class="ct2">Weekly volume</div><div class="sub2">Total '+S.unit+' lifted, last 12 weeks</div>'+lineChart(volWeeks(12),fmtK)+'</div>';
h+='<div class="card"><div class="ct2">Workouts per week</div><div class="sub2">Last 8 weeks</div>'+weekBars()+'</div>';
const ms=muscleSets(30),mx=ms[0]?ms[0][1]:1;
h+='<div class="card"><div class="ct2">Muscle balance</div><div class="sub2">Working sets, last 30 days</div>'+(ms.length?ms.map(a=>'<div class="mb"><span>'+a[0]+'</span><div class="trk"><i style="width:'+(a[1]/mx*100).toFixed(0)+'%"></i></div><b>'+a[1]+'</b></div>').join(''):'<div class="mu sm-t">No sets in the last 30 days.</div>')+'</div>';
h+='<div class="sec">All lifts</div><input class="inp" data-f="pgq" placeholder="Search your exercises…" value="'+esc(ui.pq||'')+'" autocomplete="off" style="margin-bottom:12px"><div id="pg-list">'+pgRows()+'</div>';

/* ---------- sheets ---------- */
function wrap(title,body,foot,cls){return'<div class="sheet '+(cls||'')+'"><div class="sh-h"><div class="in"><button class="ib" data-a="close" aria-label="Back">'+IC.cl+'</button><h2>'+title+'</h2></div></div>'+body+(foot?'<div class="sh-f"><div class="in">'+foot+'</div></div>':'')+'</div>'}
const bodyOf=h=>'<div class="sh-b"><div class="in">'+h+'</div></div>';

function pkItems(s){const q=toks(s.q);
let list=BUILTIN.concat(S.custom).filter(x=>(s.muscle==='All'||x.m===s.muscle)&&(s.eq==='All'||x.e===s.eq)&&q.every(t=>hay(x).some(w=>w.startsWith(t))));
if(q.length)list.sort((a,b)=>(hay(b)[0]&&hay(b)[0].startsWith(q[0])?1:0)-(hay(a)[0]&&hay(a)[0].startsWith(q[0])?1:0));
const total=list.length;list=list.slice(0,s.limit);
if(!total)return'<div class="empty"><h3>No match</h3><div>Try another word or filter, or add it yourself.</div><div style="margin-top:12px"><button class="btn pri" data-a="newex">Create “'+esc(s.q.trim()||'exercise')+'”</button></div></div>';
return'<div class="mu sm-t" style="margin:2px 0 10px">'+total+' exercise'+(total===1?'':'s')+'</div><div class="grid">'+list.map(x=>'<button class="pc '+(s.sel.has(x.id)?'sel':'')+'" data-a="pkt" data-id="'+x.id+'"><div class="im">'+exImg(x)+'</div><div class="n">'+esc(x.name)+'</div><div class="e">'+x.m+' · '+EQ[x.e]+'</div></button>').join('')+'</div>'+(total>list.length?'<button class="btn blk" data-a="pkmore" style="margin-top:12px">Show more ('+(total-list.length)+' left)</button>':'')}
const pkCount=s=>s.sel.size?'Add '+s.sel.size+' exercise'+(s.sel.size>1?'s':''):'Select exercises';

function sheetHTML(s){
if(s.type==='picker'){
return'<div class="sheet"><div class="sh-h"><div class="in"><button class="ib" data-a="close" aria-label="Back">'+IC.cl+'</button><h2>Choose exercises</h2></div></div>'
+'<div class="pk-top"><div class="in"><input class="inp" data-f="pkq" placeholder="Try “cable fly”, “abs machine”, “rope”…" value="'+esc(s.q)+'" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div>'
+'<div class="pk-chips">'+['All'].concat(MUSCLES).map(m=>'<button class="chip '+(s.muscle===m?'on':'')+'" data-a="pkm" data-v="'+m+'">'+m+'</button>').join('')+'</div><div class="pk-chips" style="padding-top:0">'+['All'].concat(Object.keys(EQ)).map(k=>'<button class="chip st '+(s.eq===k?'on':'')+'" data-a="pke" data-v="'+k+'">'+(k==='All'?'Any equipment':EQ[k])+'</button>').join('')+'</div></div>'

+'<div class="sh-f"><div class="in"><button class="btn" data-a="newex" style="flex:none">+ New</button><button class="btn pri" data-a="pkdone" id="pk-done" '+(s.sel.size||s.allowEmpty?'':'disabled')+'>'+pkCount(s)+'</button></div></div></div>'}
if(s.type==='newex'){
return wrap('New exercise',bodyOf('<label class="lb">Name</label><input class="inp" data-f="nxn" value="'+esc(s.name)+'" placeholder="e.g. Cable Pullover">'
+'<label class="lb">Muscle</label><div class="chips">'+MUSCLES.map(m=>'<button class="chip '+(s.m===m?'on':'')+'" data-a="nxm" data-v="'+m+'">'+m+'</button>').join('')+'</div>'
+'<label class="lb">Equipment</label><div class="chips">'+Object.keys(EQ).map(k=>'<button class="chip '+(s.e===k?'on':'')+'" data-a="nxe" data-v="'+k+'">'+EQ[k]+'</button>').join('')+'</div>'
+'<div class="th" style="width:70px;height:84px;margin-top:18px">'+iconFor({name:s.name,m:s.m,e:s.e})+'</div>'),'<button class="btn pri" data-a="nxsave">Save exercise</button>')}
if(s.type==='group'){const d=s.d;
const rows=d.items.map((it,i)=>{const ex=getEx(it.ex);if(!ex)return'';
return'<div class="card"><div class="row"><div class="th">'+thumb(ex.m,ex.e)+'</div><div class="grow"><div class="nm">'+esc(ex.name)+'</div><div class="mu sm-t">'+ex.m+' · '+EQ[ex.e]+'</div></div>'
+'<button class="ib" data-a="gup" data-i="'+i+'" aria-label="Move up">↑</button><button class="ib" data-a="gdn" data-i="'+i+'" aria-label="Move down">↓</button><button class="ib" data-a="grm" data-i="'+i+'" aria-label="Remove">×</button></div>'
+'<div class="gi"><label>Warm-up sets<input type="number" inputmode="numeric" min="0" data-f="gi" data-i="'+i+'" data-k="wu" value="'+it.wu+'"></label><label>Working sets<input type="number" inputmode="numeric" min="0" data-f="gi" data-i="'+i+'" data-k="sets" value="'+it.sets+'"></label><label>Reps<input type="text" inputmode="numeric" data-f="gi" data-i="'+i+'" data-k="reps" value="'+esc(it.reps)+'"></label></div></div>'}).join('');
return wrap(d.id?'Edit group':'New group',bodyOf('<label class="lb" style="margin-top:4px">Group name</label><input class="inp" data-f="gname" value="'+esc(d.name)+'" placeholder="e.g. Back, Legs, Chest + Triceps"><div style="height:14px"></div>'+rows+'<button class="btn line blk" data-a="gaddex">+ Add exercises</button><p class="mu sm-t">Tip: mix muscles freely to make hybrid groups.</p>'),
(d.id?'<button class="btn dg" data-a="gdel" style="flex:none">Delete</button>':'')+'<button class="btn pri" data-a="gsave">Save group</button>')}
if(s.type==='routine'){const d=s.d,cyc=d.mode==='cycle',arr=cyc?d.daysC:d.daysW;
const stp=(lab,k,v,min,max)=>'<div class="row" style="padding:6px 0"><div class="grow nm">'+lab+'</div><div class="step"><button data-a="rstep" data-k="'+k+'" data-n="-1" '+(v<=min?'disabled':'')+' aria-label="Fewer">−</button><b>'+v+'</b><button data-a="rstep" data-k="'+k+'" data-n="1" '+(v>=max?'disabled':'')+' aria-label="More">+</button></div></div>';
const rows=arr.map((ids,i)=>{const t=ids.filter(gget);return'<button class="day" data-a="rday" data-i="'+i+'" style="width:100%;text-align:left"><span class="d">'+(cyc?'Day '+(i+1):DAYS[i].slice(0,3))+'</span><span class="grow '+(t.length?'':'mu')+'">'+(t.length?gNames(t):'Rest')+'</span><span class="mu">›</span></button>'}).join('');
return wrap(d.id?'Edit routine':'New routine',bodyOf('<label class="lb" style="margin-top:4px">Routine name</label><input class="inp" data-f="rname" value="'+esc(d.name)+'" placeholder="e.g. 4-day split">'
+'<label class="lb">Schedule type</label><div class="seg"><button class="'+(cyc?'':'on')+'" data-a="rmode" data-v="week">Weekly</button><button class="'+(cyc?'on':'')+'" data-a="rmode" data-v="cycle">Rotating split</button></div>'
+(cyc?'<div class="card">'+stp('Training days','tr',d.tr,1,7)+stp('Rest days','rs',d.rs,0,4)+'<div class="chips" style="margin-top:10px">'+[[3,1],[4,1],[5,2],[6,1]].map(p=>'<button class="chip st '+(d.tr===p[0]&&d.rs===p[1]?'on':'')+'" data-a="rpre" data-tr="'+p[0]+'" data-rs="'+p[1]+'">'+p[0]+' + '+p[1]+' rest</button>').join('')+'</div><div class="mu sm-t" style="margin-top:12px">The cycle repeats every '+arr.length+' days. Rest days keep their place on the calendar.</div></div>'
+'<label class="lb">Today is…</label><div class="chips">'+arr.map((_,i)=>'<button class="chip '+(d.cur===i+1?'on':'')+'" data-a="rcur" data-n="'+(i+1)+'">Day '+(i+1)+'</button>').join('')+'</div>':'')
+'<label class="lb">'+(cyc?'Plan each day':'Weekly plan')+' · tap to choose groups</label><div class="card" style="padding:2px 16px">'+rows+'</div>'),
(d.id?'<button class="btn dg" data-a="rdel" style="flex:none">Delete</button>':'')+'<button class="btn pri" data-a="rsave">Save routine</button>')}
if(s.type==='gpick'){
return wrap(esc(s.title),bodyOf('<div class="chips">'+S.groups.map(g=>'<button class="chip '+(s.sel.has(g.id)?'on':'')+'" data-a="gpt" data-id="'+g.id+'" style="padding:12px 16px;font-size:15px">'+esc(g.name)+'</button>').join('')+'</div>'+(s.rest?'<p class="mu sm-t" style="margin-top:16px">Select none for a rest day.</p>':'')),
'<button class="btn pri" data-a="gpdone">Done</button>')}
if(s.type==='prog'){const ex=getEx(s.id)||{name:'Exercise',m:'Chest',e:'W'},ss=sessions(s.id),st=stats(s.id);
const pts=ss.map(x=>({d:x.d,pr:x.pr,y:s.metric==='w'?x.tp.w:s.metric==='e'?Math.round(x.e1*10)/10:Math.round(x.v)}));
const tv=ss.reduce((a,x)=>a+x.v,0),b1=ss.reduce((a,x)=>Math.max(a,x.e1),0),np=ss.filter(x=>x.pr).length;
return wrap('Progress',bodyOf('<div class="row" style="margin:4px 0 14px">'+exThumb(ex,'th" style="width:104px;height:70px')+'<div class="grow"><div class="nm" style="font-size:18px">'+esc(ex.name)+'</div><div class="mu sm-t">'+ex.m+' · '+EQ[ex.e]+'</div></div></div>'
+'<div class="tiles t2"><div class="tile"><b>'+(st.pr?fmtN(st.pr.w)+' <small style="font-size:14px">'+S.unit+' × '+fmtN(st.pr.r)+'</small>':'–')+'</b><span>Personal record</span></div><div class="tile"><b>'+(b1?fmtN(Math.round(b1*10)/10)+' <small style="font-size:14px">'+S.unit+'</small>':'–')+'</b><span>Best est. 1RM</span></div><div class="tile"><b>'+ss.length+(np?' <small style="font-size:14px">★ '+np+'</small>':'')+'</b><span>Sessions</span></div><div class="tile"><b>'+(tv>=10000?fmtN(tv/1000)+'k':Math.round(tv))+' <small style="font-size:14px">'+S.unit+'</small></b><span>Total volume</span></div></div>'
+'<div class="seg">'+[['w','Top weight'],['e','Est. 1RM'],['v','Volume']].map(m=>'<button class="'+(s.metric===m[0]?'on':'')+'" data-a="pmet" data-v="'+m[0]+'">'+m[1]+'</button>').join('')+'</div>'
+'<div class="card">'+(pts.length?lineChart(pts,s.metric==='v'?v=>Math.round(v):v=>fmtN(Math.round(v*10)/10)):'<div class="empty">No sets logged yet</div>')+(np?'<div class="mu sm-t" style="margin-top:6px">★ marks a session where you set a new PR</div>':'')+'</div>'
+'<div class="sec">Sessions</div><div class="tb2">'+ss.slice().reverse().map(x=>'<div class="hr"><div class="hd" style="width:74px"><span>'+esc(pd(x.d).toLocaleDateString(undefined,{weekday:'short'}))+'</span><b style="font-size:16px">'+esc(sdate(x.d))+'</b></div><div class="hb"><div class="g">'+fmtN(x.tp.w)+' '+S.unit+' × '+fmtN(x.tp.r)+'</div><div class="x">'+x.n+' working set'+(x.n>1?'s':'')+' · '+Math.round(x.v)+' '+S.unit+' volume</div></div>'+(x.pr?'<span class="star">★</span>':'')+'</div>').join('')+'</div>'))}
if(s.type==='doc'){const D=DOCS[s.k];return wrap(D.t,bodyOf('<div class="doc">'+D.h()+'</div>'))}
if(s.type==='settings'){const lr=(k,l)=>'<button class="lrow" data-a="doc" data-v="'+k+'"><span>'+l+'</span><span class="mu">›</span></button>';
return wrap('Settings',bodyOf('<div class="setlab" style="margin-top:6px">Preferences</div><div class="card"><label class="lb" style="margin:0 2px 7px">Weight unit</label><div class="seg"><button class="'+(S.unit==='kg'?'on':'')+'" data-a="unit" data-v="kg">kg</button><button class="'+(S.unit==='lb'?'on':'')+'" data-a="unit" data-v="lb">lb</button></div>'
+'<label class="lb" style="margin:14px 2px 7px">Appearance</label><div class="seg">'+['auto','light','dark'].map(t=>'<button class="'+(S.theme===t?'on':'')+'" data-a="theme" data-v="'+t+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</div></div>'
+'<div class="setlab">Your data</div><div class="card"><p class="mu sm-t" style="margin:0 0 10px">Everything is stored on this device only. Copy the backup text somewhere safe, or paste a backup here and restore it.</p><textarea class="inp" id="bk" spellcheck="false" placeholder="Backup text appears here"></textarea>'
+'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-a="bkshow">Show backup</button><button class="btn sm" data-a="bkcopy">Copy</button><button class="btn sm" data-a="bkrestore">Restore from text</button></div></div>'
+'<div class="setlab">About</div><div class="card lst">'+lr('about','About Lift')+lr('help','Help & FAQ')+lr('privacy','Privacy Policy')+lr('terms','Terms of Use')+lr('credits','Credits')+'</div>'
+'<div class="aboutf">'+LOGO(44)+'<div><b>Lift</b><div class="mu sm-t">Version '+APPV+' · Works offline</div></div></div>'
+'<button class="btn dg blk" data-a="erase">Erase all data</button>'))}
return''}

/* ---------- render ---------- */
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function render(){
const csl=[...document.querySelectorAll('.pk-chips')].map(c=>c.scrollLeft);
const v={today:vToday,work:vWork,rout:vRout,prog:vProg,hist:vHist}[ui.tab];
const app=$('#app');const first=(ui.tab==='today'?head(''):'')+v();
app.innerHTML=first;
$('#nav').innerHTML=[['today','Today',IC.today],['work','Workouts',IC.work],['rout','Routine',IC.rout],['prog','Progress',IC.prog],['hist','History',IC.hist]].map(t=>'<button class="'+(ui.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+'<span class="ic">'+t[2]+'</span>'+t[1]+'</button>').join('');
$('#sheets').innerHTML=ui.stack.map(sheetHTML).join('')+(ui.confirm?'<div class="cf"><div class="card"><p style="margin:0 0 14px;font-weight:600">'+esc(ui.confirm.msg)+'</p><div style="display:flex;gap:8px"><button class="btn grow" data-a="cn">Cancel</button><button class="btn pri grow" data-a="cy">'+esc(ui.confirm.yes||'Confirm')+'</button></div></div></div>':'');
document.body.style.overflow=ui.stack.length?'hidden':'';
document.querySelectorAll('.pk-chips').forEach((c,i)=>{c.scrollLeft=csl[i]||0});
}
function pkRefresh(){const s=top();if(!s||s.type!=='picker')return;$('#pk-list').innerHTML=pkItems(s);const b=$('#pk-done');b.textContent=pkCount(s);b.disabled=!(s.sel.size||s.allowEmpty)}
const ask=(msg,yes,fn)=>{ui.confirm={msg,yes,fn};render()};

/* ---------- actions ---------- */
function openPicker(sel,onDone,allowEmpty){ui.stack.push({type:'picker',q:'',muscle:'All',eq:'All',limit:60,sel:new Set(sel),onDone,allowEmpty});render()}
function startLog(gids){const L={groups:gids.slice(),entries:[]};S.logs[ui.date]=L;addGroupEx(L,gids);save();render()}
function addGroupEx(L,gids){gids.forEach(gid=>{const g=gget(gid);if(!g)return;g.items.forEach(it=>{if(!getEx(it.ex)||L.entries.some(e=>e.ex===it.ex))return;L.entries.push({ex:it.ex,sets:mkSets(it.ex,ui.date,it.wu,it.sets,it.reps)})})})}
function swap(a,i,j){if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function seed(){const mk=(name,list)=>({id:uid('g'),name,items:list.map(([ex,wu,sets,reps])=>({ex,wu,sets,reps}))});
const G=[mk('Chest',[['e0',1,4,'8'],['e4',0,3,'10'],['e6',0,3,'12']]),
mk('Back',[['e16',0,3,'8'],['e12',1,4,'8'],['e18',0,3,'10'],['e19',0,3,'12']]),
mk('Shoulders',[['e23',1,4,'8'],['e28',0,4,'15'],['e30',0,3,'15']]),
mk('Biceps',[['e35',1,3,'10'],['e39',0,3,'12'],['e40',0,3,'12']]),
mk('Triceps',[['e44',1,3,'8'],['e49',0,3,'12'],['e46',0,3,'12']]),
mk('Legs',[['e57',2,4,'6'],['e66',1,3,'8'],['e63',0,3,'12'],['e69',0,3,'12'],['e77',0,4,'15']])];
S.groups.push(...G);const id=n=>G.find(g=>g.name===n).id;
const r={id:uid('r'),name:'Example split',mode:'week',days:[[id('Chest'),id('Triceps')],[id('Back'),id('Biceps')],[],[id('Shoulders')],[id('Legs')],[],[]]};
S.routines.push(r);if(!S.active)S.active=r.id;save();render();toast('Examples added')}

const A={
tab:t=>{ui.tab=t.dataset.v;ui.stack=[];render();window.scrollTo(0,0)},
dprev:()=>{ui.date=addD(ui.date,-1);ui.pick=new Set();render()},
dnext:()=>{ui.date=addD(ui.date,1);ui.pick=new Set();render()},
dtoday:()=>{ui.date=today();render()},
pickg:t=>{const id=t.dataset.id;ui.pick.has(id)?ui.pick.delete(id):ui.pick.add(id);render()},
startPick:()=>{startLog([...ui.pick]);ui.pick=new Set()},
startR:()=>{const rt=S.routines.find(r=>r.id===S.active);startLog(slotFor(rt,ui.date).ids)},
rest:()=>{S.logs[ui.date]={rest:true,groups:[],entries:[]};save();render()},
empty:()=>{S.logs[ui.date]={groups:[],entries:[]};save();render()},
resetDay:()=>ask('Clear this day so you can pick a different workout? Logged sets for this day will be removed.','Clear day',()=>{delete S.logs[ui.date];save();render()}),
done:t=>{const en=lg().entries[+t.dataset.e],s=en.sets[+t.dataset.s];s.d=s.d?0:1;
if(s.d&&!s.w){const lp=lastPerf(en.ex,ui.date);if(lp)s.w=lp.w}
save();render();if(s.d&&stats(en.ex).flags.has(s))toast('New personal record!')},
delset:t=>{lg().entries[+t.dataset.e].sets.splice(+t.dataset.s,1);save();render()},
addset:t=>{const sets=lg().entries[+t.dataset.e].sets;const p=[...sets].reverse().find(s=>!s.wu);sets.push({w:p?p.w:'',r:p?p.r:'',d:0});save();render()},
addwu:t=>{const sets=lg().entries[+t.dataset.e].sets;const f=sets.find(s=>!s.wu);const i=sets.filter(s=>s.wu).length;sets.splice(i,0,{wu:1,w:f&&f.w?rnd(num(f.w)*.5):'',r:f?f.r:'',d:0});save();render()},
delentry:t=>{lg().entries.splice(+t.dataset.e,1);save();render()},
logAddEx:()=>openPicker([],ids=>{const L=lg();ids.forEach(id=>{if(!L.entries.some(e=>e.ex===id))L.entries.push({ex:id,sets:mkSets(id,ui.date,0,3,'')})});save()}),
logAddGrp:()=>{ui.stack.push({type:'gpick',title:'Add workout groups',sel:new Set(),onDone:ids=>{const L=lg();ids.forEach(id=>{if(!L.groups.includes(id))L.groups.push(id)});addGroupEx(L,ids);save()}});render()},
openDay:t=>{ui.date=t.dataset.d;ui.tab='today';render();window.scrollTo(0,0)},
hv:t=>{ui.hv=t.dataset.v;render()},
/* picker */
pkt:t=>{const s=top(),id=t.dataset.id;s.sel.has(id)?s.sel.delete(id):s.sel.add(id);t.classList.toggle('sel');const b=$('#pk-done');b.textContent=pkCount(s);b.disabled=!(s.sel.size||s.allowEmpty)},
pkm:t=>{top().muscle=t.dataset.v;top().limit=60;render()},pke:t=>{top().eq=t.dataset.v;top().limit=60;render()},pkmore:()=>{top().limit+=60;pkRefresh()},openProg:t=>{ui.stack.push({type:'prog',id:t.dataset.id,metric:'w'});render()},pmet:t=>{top().metric=t.dataset.v;render()},
pkdone:()=>{const s=top();ui.stack.pop();s.onDone([...s.sel]);render()},
newex:()=>{const s=top();ui.stack.push({type:'newex',name:s&&s.type==='picker'?s.q.trim():'',m:s&&s.type==='picker'&&s.muscle!=='All'?s.muscle:'Chest',e:'D'});render()},
nxm:t=>{top().m=t.dataset.v;render()},nxe:t=>{top().e=t.dataset.v;render()},
nxsave:()=>{const s=top();if(!s.name.trim()){toast('Give it a name');return}
const ex={id:uid('c'),name:s.name.trim(),m:s.m,e:s.e};S.custom.push(ex);save();ui.stack.pop();const p=top();if(p&&p.type==='picker'){p.sel.add(ex.id);p.q='';p.muscle='All'}render();toast('Exercise added')},
close:()=>{ui.stack.pop();render()},
/* groups */
newg:()=>{ui.stack.push({type:'group',d:{name:'',items:[]}});render()},
editg:t=>{const g=gget(t.dataset.id);ui.stack.push({type:'group',d:JSON.parse(JSON.stringify(g))});render()},
gaddex:()=>{const d=top().d;openPicker(d.items.map(i=>i.ex),ids=>{const old=new Map(d.items.map(i=>[i.ex,i]));d.items=ids.map(id=>old.get(id)||{ex:id,wu:1,sets:3,reps:'10'})},true)},
gup:t=>{const i=+t.dataset.i;swap(top().d.items,i,i-1);render()},gdn:t=>{const i=+t.dataset.i;swap(top().d.items,i,i+1);render()},
grm:t=>{top().d.items.splice(+t.dataset.i,1);render()},
gsave:()=>{const d=top().d;d.name=d.name.trim()||'Untitled group';if(!d.items.length){toast('Add at least one exercise');return}
if(d.id){const i=S.groups.findIndex(g=>g.id===d.id);S.groups[i]=d}else{d.id=uid('g');S.groups.push(d)}save();ui.stack.pop();render();toast('Group saved')},
gdel:()=>{const d=top().d;ask('Delete “'+d.name+'”? It will also be removed from routines.','Delete',()=>{S.groups=S.groups.filter(g=>g.id!==d.id);S.routines.forEach(r=>r.days=r.days.map(x=>x.filter(id=>id!==d.id)));save();ui.stack.pop();render()})},
seed,
/* routines */
newr:()=>{ui.stack.push({type:'routine',d:{name:'',mode:'week',tr:4,rs:1,cur:1,daysW:[[],[],[],[],[],[],[]],daysC:[[],[],[],[],[]]}});render()},
editr:t=>{const r=S.routines.find(x=>x.id===t.dataset.id),cyc=r.mode==='cycle',cp=JSON.parse(JSON.stringify(r.days));const d={id:r.id,name:r.name,mode:cyc?'cycle':'week',tr:4,rs:1,cur:1,daysW:[[],[],[],[],[],[],[]],daysC:[[],[],[],[],[]]};
if(cyc){d.daysC=cp;d.tr=r.tr||cp.filter(x=>x.length).length||1;d.rs=r.rs!=null?r.rs:cp.length-d.tr;d.cur=slotFor(r,today()).k+1}else d.daysW=cp;ui.stack.push({type:'routine',d});render()},
rmode:t=>{top().d.mode=t.dataset.v;render()},
rstep:t=>{const d=top().d,k=t.dataset.k,n=+t.dataset.n;d[k]=k==='tr'?Math.min(7,Math.max(1,d.tr+n)):Math.min(4,Math.max(0,d.rs+n));rebuildC(d);render()},
rpre:t=>{const d=top().d;d.tr=+t.dataset.tr;d.rs=+t.dataset.rs;rebuildC(d);render()},
rcur:t=>{top().d.cur=+t.dataset.n;render()},
rmset:t=>{lg().entries[+t.dataset.e].sets.pop();save();render()},
doc:t=>{ui.stack.push({type:'doc',k:t.dataset.v});render()},
pex:t=>{ui.pex=t.dataset.id;render()},pmi:t=>{ui.pm=t.dataset.v;render()},
setActive:t=>{S.active=t.dataset.id;save();render();toast('Routine activated')},
rday:t=>{const d=top().d,i=+t.dataset.i,cyc=d.mode==='cycle',arr=cyc?d.daysC:d.daysW;ui.stack.push({type:'gpick',title:cyc?'Day '+(i+1):DAYS[i],rest:true,sel:new Set(arr[i].filter(gget)),onDone:ids=>{arr[i]=ids}});render()},
rsave:()=>{const d=top().d,cyc=d.mode==='cycle',r={id:d.id||uid('r'),name:d.name.trim()||'My routine',mode:d.mode,days:cyc?d.daysC:d.daysW};if(cyc){r.tr=d.tr;r.rs=d.rs;r.start=addD(today(),-(d.cur-1))}
if(d.id){const i=S.routines.findIndex(x=>x.id===d.id);S.routines[i]=r}else{S.routines.push(r);if(!S.active)S.active=r.id}save();ui.stack.pop();render();toast('Routine saved')},
rdel:()=>{const d=top().d;ask('Delete routine “'+d.name+'”?','Delete',()=>{S.routines=S.routines.filter(r=>r.id!==d.id);if(S.active===d.id)S.active=S.routines[0]?S.routines[0].id:null;save();ui.stack.pop();render()})},
gpt:t=>{const s=top(),id=t.dataset.id;s.sel.has(id)?s.sel.delete(id):s.sel.add(id);render()},
gpdone:()=>{const s=top();ui.stack.pop();s.onDone(S.groups.map(g=>g.id).filter(id=>s.sel.has(id)));render()},
/* settings */
settings:()=>{ui.stack.push({type:'settings'});render()},
unit:t=>{S.unit=t.dataset.v;save();render()},
theme:t=>{S.theme=t.dataset.v;save();applyTheme();render()},
bkshow:()=>{const b=$('#bk');b.value=JSON.stringify(S);b.focus();b.select()},
bkcopy:()=>{const b=$('#bk');if(!b.value)b.value=JSON.stringify(S);b.focus();b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copied':'Selected – copy it manually')},
bkrestore:()=>{try{const s=JSON.parse($('#bk').value);if(!s||s.v!==1||typeof s.logs!=='object')throw 0;ask('Replace everything on this device with the pasted backup?','Restore',()=>{S=Object.assign(fresh(),s);save();applyTheme();ui.stack=[];render();toast('Backup restored')})}catch(e){toast('That doesn’t look like a valid backup')}},
erase:()=>ask('Erase all workouts, routines and logs from this device? This can’t be undone.','Erase',()=>{S=fresh();save();applyTheme();ui.stack=[];ui.tab='today';render();toast('All data erased')}),
cy:()=>{const c=ui.confirm;ui.confirm=null;c.fn();if(!ui.confirm)render()},
cn:()=>{ui.confirm=null;render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t,e)});

const H={
w:(t)=>{lg().entries[+t.dataset.e].sets[+t.dataset.s].w=t.value;save()},
r:(t)=>{lg().entries[+t.dataset.e].sets[+t.dataset.s].r=t.value;save()},
pkq:t=>{const s=top();s.q=t.value;s.limit=60;pkRefresh()},pgq:t=>{ui.pq=t.value;pgList()},
nxn:t=>{top().name=t.value},
gname:t=>{top().d.name=t.value},
rname:t=>{top().d.name=t.value},
gi:t=>{const it=top().d.items[+t.dataset.i],k=t.dataset.k;it[k]=k==='reps'?t.value:Math.max(0,parseInt(t.value)||0)}
};
const onIn=e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&H[f])H[f](e.target)};
document.addEventListener('input',onIn);
applyTheme();render();
})();
</script>
</body>
</html>
