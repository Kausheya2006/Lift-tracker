import java.util.Properties

plugins {
    id 'com.android.application'
}

// Release signing is optional and read from keystore.properties (git-ignored).
// See keystore.properties.example. Without it, release builds are produced unsigned.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.lift.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.lift.tracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.3"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
